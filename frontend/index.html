<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- seo:start -->
    <!-- Filled in by tools/seo.ts: title, description, canonical, robots and social preview tags. -->
    <!-- seo:end -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f2f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a131b" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Applies the saved theme before first paint (a file, not inline, so the security policy can forbid inline scripts). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 36rem; margin: 4rem auto; padding: 0 1rem; font: 16px/1.6 system-ui, sans-serif; color: #17212b">
        <h1 style="font-weight: 600">Niveloft</h1>
        <p>Niveloft is a project workspace for focused teams: tasks, owners and deadlines in one place. It needs JavaScript to run; please turn it on, or use a browser that supports it.</p>
        <p><a href="/privacy">Privacy policy</a> · <a href="/terms">Terms and conditions</a></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
